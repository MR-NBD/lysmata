name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1
      with:
        version: nightly

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8

    - name: Install and configure solc
      run: |
        solc-select install 0.8.19
        solc-select use 0.8.19

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 lysmata --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 lysmata --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Verify package structure
      run: |
        python -c "import lysmata; print(f'Lysmata version: {lysmata.__version__}')"

    - name: Check Anvil availability
      run: |
        anvil --version

    - name: Test contract compilation
      run: |
        # Test that crytic-compile can process example contracts
        crytic-compile --export-format standard tests/invariant_breaker.sol || true

  code-quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black isort

    - name: Check code formatting with black
      run: |
        black --check lysmata/

    - name: Check import sorting with isort
      run: |
        isort --check-only lysmata/
