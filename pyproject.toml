[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "lysmata"
version = "0.1.0"
description = "A smart contract fuzzer for Solidity"
readme = "README.md"
requires-python = ">=3.8,<3.11"
license = {text = "MIT"}
keywords = ["ethereum", "solidity", "fuzzing", "testing", "smart-contracts", "security"]
authors = [
    {name = "MR-NBD", email = "albertoameglio@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
]

[project.urls]
Homepage = "https://github.com/MR-NBD/lysmata"
"Bug Reports" = "https://github.com/MR-NBD/lysmata/issues"
"Source" = "https://github.com/MR-NBD/lysmata"

[project.scripts]
lysmata = "lysmata.main:main"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=lysmata --cov-report=html --cov-report=term-missing"
